version: "3.8"

# ── FashionEcom Production ──────────────────
# Dung chung shared-mysql, shared-redis, shared-nginx tu WebPhoto
# Deploy: bash scripts/quick-deploy.sh <vps-ip> [domain]

services:
  # ── Backend (NestJS) ──────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: fashionecom-backend:latest
    container_name: fashionecom-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
    volumes:
      - fashionecom_uploads:/app/uploads
    depends_on: []
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/api/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 768M
    networks:
      - fashionecom-net
      - webphoto_backend

  # ── Frontend (Next.js) ────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN:-shop.bhquan.store}
        INTERNAL_API_URL: http://fashionecom-api:4000/api
    image: fashionecom-frontend:latest
    container_name: fashionecom-frontend
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_SITE_URL: https://${DOMAIN:-shop.bhquan.store}
      INTERNAL_API_URL: http://fashionecom-api:4000/api
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -s --max-time 30 -o /dev/null http://127.0.0.1:3000 || exit 1']
      interval: 30s
      timeout: 35s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 768M
    networks:
      - fashionecom-net
      - webphoto_backend

volumes:
  fashionecom_uploads:

networks:
  fashionecom-net:
  webphoto_backend:
    name: webphoto_backend
    external: true
