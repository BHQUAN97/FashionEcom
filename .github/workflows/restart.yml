name: Restart Services

on:
  workflow_dispatch:

env:
  APP_DIR: /opt/fashionecom

jobs:
  restart:
    name: "Restart containers"
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass > /dev/null
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.VPS_PORT }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSHPASS=${{ secrets.VPS_PASSWORD }}" >> $GITHUB_ENV

      - name: Restart + diagnose
        run: |
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT }}"

          echo "=== Container status before ==="
          sshpass -e ssh -p $PORT $VPS "docker ps -a --format 'table {{.Names}}\t{{.Status}}' | grep -E 'fashion|shared'"

          echo ""
          echo "=== Restart fashionecom containers ==="
          sshpass -e ssh -p $PORT $VPS "
            cd ${APP_DIR}
            docker compose -f docker-compose.prod.yml restart backend frontend 2>&1 || \
            docker compose -f docker-compose.prod.yml up -d backend frontend 2>&1
          "

          sleep 15

          echo ""
          echo "=== Container status after ==="
          sshpass -e ssh -p $PORT $VPS "docker ps --format 'table {{.Names}}\t{{.Status}}' | grep -E 'fashion|shared'"

          echo ""
          echo "=== Backend logs (last 20) ==="
          sshpass -e ssh -p $PORT $VPS "docker logs fashionecom-api --tail 20 2>&1"

          echo ""
          echo "=== Frontend logs (last 30) ==="
          sshpass -e ssh -p $PORT $VPS "docker logs fashionecom-frontend --tail 30 2>&1"

          echo ""
          echo "=== Connect nginx to fashionecom_fashionecom-net ==="
          sshpass -e ssh -p $PORT $VPS "
            docker network connect fashionecom_fashionecom-net shared-nginx 2>/dev/null || echo 'Already connected'
            docker exec shared-nginx nginx -s reload 2>&1 || true
          "

          sleep 10

          echo ""
          echo "=== Test nginx -> frontend connectivity ==="
          sshpass -e ssh -p $PORT $VPS "
            echo '--- nginx can reach fashionecom-frontend? ---'
            docker exec shared-nginx wget -qO- --timeout=5 http://fashionecom-frontend:3000 > /dev/null 2>&1 && echo 'REACHABLE' || echo 'NOT REACHABLE'
            echo '--- fashionecom-frontend container inspect networks ---'
            docker inspect fashionecom-frontend --format '{{range \$k, \$v := .NetworkSettings.Networks}}{{\$k}} {{end}}' 2>&1
            echo '--- shared-nginx networks ---'
            docker inspect shared-nginx --format '{{range \$k, \$v := .NetworkSettings.Networks}}{{\$k}} {{end}}' 2>&1
            echo '--- fashionecom-frontend port binding ---'
            docker inspect fashionecom-frontend --format '{{.NetworkSettings.Ports}}' 2>&1
          "

          echo ""
          echo "=== VPS memory ==="
          sshpass -e ssh -p $PORT $VPS "free -h"
